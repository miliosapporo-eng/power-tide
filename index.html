<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Application | Power Tide</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts: Bodoni Moda -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap');
        
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: black;
            color: #e2e8f0; /* slate-200 */
        }
        
        .font-vogue {
            font-family: 'Bodoni Moda', serif;
            font-optical-sizing: auto;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b45309; /* amber-700 */
        }

        /* Selection Color */
        ::selection {
            background-color: #f59e0b; /* amber-500 */
            color: black;
        }
        
        /* Animations */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.8s ease-out forwards;
        }

        /* Form Responsive Wrapper */
        .form-wrapper {
            position: relative;
            width: 100%;
            /* フォームの長さに合わせて調整 (項目が多い場合は200%以上に設定) */
            padding-top: 220%; 
            overflow: hidden;
        }
        @media (min-width: 768px) {
            .form-wrapper {
                padding-top: 160%;
            }
        }
        .form-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-black">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex-shrink-0 flex items-center group cursor-pointer" onclick="location.href='index.html'">
                    <!-- ロゴ画像へのパスは適宜調整してください -->
                    <img src="images/powertide.png" alt="power tide" class="h-10 w-auto object-contain hover:opacity-80 transition-opacity">
                </div>
                
                <div class="hidden md:flex space-x-8 h-full items-center">
                    <a href="index.html#concept" class="text-[10px] font-bold text-slate-400 hover:text-amber-400 transition-colors uppercase tracking-[0.2em] font-vogue">Concept</a>
                    <a href="index.html#schedule" class="text-[10px] font-bold text-slate-400 hover:text-amber-400 transition-colors uppercase tracking-[0.2em] font-vogue">Schedule</a>
                    <a href="index.html#cast" class="text-[10px] font-bold text-slate-400 hover:text-amber-400 transition-colors uppercase tracking-[0.2em] font-vogue">Cast</a>
                    <a href="index.html#system" class="text-[10px] font-bold text-slate-400 hover:text-amber-400 transition-colors uppercase tracking-[0.2em] font-vogue">System</a>
                </div>

                <div class="hidden md:flex items-center">
                    <button class="bg-white text-black px-8 py-2.5 text-xs font-bold hover:bg-amber-500 transition-all duration-300 shadow-[0_0_15px_rgba(245,158,11,0.2)] tracking-[0.15em] font-vogue border border-transparent hover:border-amber-500">
                        RESERVATION
                    </button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-slate-200 hover:text-amber-500 focus:outline-none">
                        <i data-lucide="menu" class="h-7 w-7"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Area -->
    <div class="relative pt-32 pb-16 md:pt-48 md:pb-24 overflow-hidden bg-black">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-full max-w-4xl h-96 bg-amber-500/5 blur-[120px] z-0"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto px-4 text-center animate-fade-in-up">
            <span class="text-amber-600 font-vogue tracking-[0.4em] text-xs uppercase mb-4 block">Recruitment</span>
            <h1 class="text-5xl md:text-7xl font-vogue font-bold text-white italic mb-6">
                Model <span class="text-slate-600 not-italic">Application</span>
            </h1>
            <div class="w-24 h-px bg-amber-500 mx-auto mb-8"></div>
            <p class="text-slate-400 text-sm md:text-base leading-relaxed font-light tracking-widest max-w-2xl mx-auto">
                北海道の夜に溶け込み、一瞬の美を永遠に。
            </p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 pb-32 relative z-10">
        <!-- Message Box -->
        <div class="mb-16 bg-zinc-900/30 border border-white/5 p-8 md:p-12 text-center">
            <h2 class="text-2xl font-vogue text-amber-500 italic mb-4">Be a Muse.</h2>
            <p class="text-slate-400 text-sm leading-loose">
                私たちは、あなたの感性と個性を最大限に尊重します。<br>
                特別なスキルは必要ありません。あなたの「想い」をここから聞かせてください。
            </p>
        </div>

        <!-- Google Form Embed -->
        <div class="bg-zinc-900 border border-white/10 shadow-2xl overflow-hidden rounded-sm">
            <div class="form-wrapper">
                <!-- 埋め込み用URLに変換済み -->
                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe2Jb5x8YFrUp6Z4nzFSBELApOq8uk-CgNY4PyEcpgWkAfaEA/viewform?embedded=true" 
                        frameborder="0" 
                        marginheight="0" 
                        marginwidth="0">
                    読み込んでいます…
                </iframe>
            </div>
        </div>

        <!-- Back to Top -->
        <div class="mt-16 text-center">
            <a href="index.html" class="inline-flex items-center gap-3 text-[10px] font-bold tracking-[0.3em] text-slate-500 hover:text-amber-500 transition-colors uppercase font-vogue group">
                <span class="group-hover:-translate-x-2 transition-transform duration-300">←</span> Back to Main Site
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-slate-400 py-20 border-t border-zinc-900">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-start gap-12">
                <div class="max-w-xs">
                    <img src="images/powertide.png" alt="power tide" class="h-8 w-auto mb-8 opacity-50 grayscale hover:grayscale-0 transition-all">
                    <div class="flex space-x-6">
                        <a href="#" class="text-slate-600 hover:text-white transition-colors">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" /></svg>
                        </a>
                        <a href="#" class="text-slate-600 hover:text-white transition-colors">
                            <i data-lucide="mail" class="w-[18px] h-[18px]"></i>
                        </a>
                    </div>
                </div>

                <div class="flex gap-20">
                    <div>
                        <h4 class="font-bold text-white text-[10px] mb-6 uppercase tracking-widest text-amber-600">Legal</h4>
                        <ul class="space-y-4 text-[10px] font-bold tracking-widest uppercase text-zinc-500">
                            <li><a href="#" class="hover:text-white transition-colors">Terms of Service</a></li>
                            <li><a href="#" class="hover:text-white transition-colors">Privacy Policy</a></li>
                            <li><a href="#" class="hover:text-white transition-colors">Contact Us</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="mt-20 pt-8 border-t border-zinc-900 flex justify-center items-center text-[10px] text-zinc-700 uppercase tracking-widest font-vogue">
                &copy; 2026 MiLIo, LLC. ALL RIGHTS RESERVED.
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        mobileMenuBtn.addEventListener('click', () => {
            alert('Navigation is restricted on this page.');
        });
    </script>
</body>
</html>
